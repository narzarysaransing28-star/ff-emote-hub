<script>

let selectedEmote = null;


/* SELECT EMOTE */

function selectEmote(button, name, id) {

    document
        .querySelectorAll(".card")
        .forEach(card => {

            card.classList.remove("selected");

        });


    button
        .parentElement
        .classList
        .add("selected");


    selectedEmote = {
        name: name,
        id: id
    };


    showStatus(
        "✅ " +
        name +
        " selected"
    );
}


/* SEND EMOTE */

function sendEmote() {

    const server =
        document
        .getElementById("server")
        .value;


    const teamCode =
        document
        .getElementById("teamCode")
        .value
        .trim();


    const uid1 =
        document
        .getElementById("uid1")
        .value
        .trim();


    const uid2 =
        document
        .getElementById("uid2")
        .value
        .trim();


    const uid3 =
        document
        .getElementById("uid3")
        .value
        .trim();


    const uid4 =
        document
        .getElementById("uid4")
        .value
        .trim();


    /* TEAM CODE */

    if (!/^\d{7}$/.test(teamCode)) {

        showStatus(
            "❌ Team Code exactly 7 digits hona chahiye."
        );

        return;
    }


    /* PLAYER 1 */

    if (!/^\d{7,15}$/.test(uid1)) {

        showStatus(
            "❌ Player 1 UID 7-15 digits hona chahiye."
        );

        return;
    }


    /* EMOTE */

    if (!selectedEmote) {

        showStatus(
            "❌ Pehle ek emote select karo."
        );

        return;
    }


    /* COLLECT PLAYERS */

    const players = [
        uid1,
        uid2,
        uid3,
        uid4
    ].filter(uid => {

        return /^\d{7,15}$/.test(uid);

    });


    /* REQUEST OBJECT */

    const requestData = {

        server: server,

        teamCode: teamCode,

        players: players,

        emote: {

            name: selectedEmote.name,

            id: selectedEmote.id

        }

    };


    console.log(
        "Emote Request:",
        requestData
    );


    /* DEMO RESPONSE */

    showStatus(
        "✅ Request ready<br>" +

        "🎭 Emote: " +
        selectedEmote.name +

        "<br>" +

        "👥 Players: " +
        players.length +

        "<br>" +

        "🔢 Team Code: " +
        teamCode
    );

}


/* STATUS */

function showStatus(message) {

    const box =
        document
        .getElementById("status");


    box.style.display = "block";

    box.innerHTML = message;

}


/* SEARCH */

document
.getElementById("search")
.addEventListener(
    "input",
    function () {

        const text =
            this.value
            .toLowerCase();


        document
        .querySelectorAll(".card")
        .forEach(card => {

            const name =
                card
                .dataset
                .name
                .toLowerCase();


            card.style.display =
                name.includes(text)
                ? ""
                : "none";

        });

    }
);

</script>
