<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Emote Hub</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0b0f;
            color: white;
            text-align: center;
        }

        header {
            padding: 30px 15px;
            background: #15151d;
        }

        h1 {
            margin: 0;
            font-size: 32px;
        }

        p {
            color: #aaa;
        }

        .search {
            margin: 20px;
        }

        input {
            width: 85%;
            max-width: 500px;
            padding: 14px;
            border-radius: 10px;
            border: none;
            outline: none;
            font-size: 16px;
        }

        .emotes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            padding: 20px;
            max-width: 900px;
            margin: auto;
        }

        .card {
            background: #171720;
            padding: 20px;
            border-radius: 15px;
        }

        .card button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <h1>🔥 FF Emote Hub</h1>
    <p>Free Fire Emote Showcase</p>
</header>

<div class="search">
    <input type="text" id="search" placeholder="Search emote...">
</div>

<div class="emotes">

    <div class="card">
        <img src="file_000000008dbc8211981b48491d42efcb.png"
     alt="Emote 1"
     style="width:100%; border-radius:12px;">
        <h2>Emote 1</h2>
        <p>Legendary Emote</p>
        <button onclick="preview('Emote 1')">▶ Preview</button>
    </div>

    <div class="card">
        <h2>Emote 2</h2>
        <p>Dance Emote</p>
        <button onclick="preview('Emote 2')">▶ Preview</button>
    </div>

    <div class="card">
        <h2>Emote 3</h2>
        <p>Special Emote</p>
        <button onclick="preview('Emote 3')">▶ Preview</button>
    </div>

</div>

<script>
function preview(name) {
    alert("Playing: " + name);
}
</script>
<div id="previewBox" class="preview-box">
    <div class="preview-content">
        <span class="close" onclick="closePreview()">✕</span>

        <img src="file_000000008dbc8211981b48491d42efcb.png"
             alt="Emote Preview">

        <h2 id="previewName">Emote 1</h2>
        <p>✨ Emote Preview</p>
    </div>
</div><div id="previewBox" class="preview-box">

    <div class="preview-content">

        <span class="close" onclick="closePreview()">✕</span>

        <img src="file_000000008dbc8211981b48491d42efcb.png"
             alt="Emote Preview">

        <h2 id="previewName">Emote 1</h2>

        <p>🔥 Emote Preview</p>

    </div>

</div>

<style>
.preview-box {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    justify-content: center;
    align-items: center;
    z-index: 999;
}

.preview-content {
    width: 85%;
    max-width: 400px;
    background: #171720;
    padding: 20px;
    border-radius: 20px;
    text-align: center;
    position: relative;
}

.preview-content img {
    width: 100%;
    border-radius: 15px;
}

.close {
    position: absolute;
    right: 15px;
    top: 10px;
    font-size: 25px;
    cursor: pointer;
}
</style>

<script>
function preview(name) {
    document.getElementById("previewName").innerText = name;
    document.getElementById("previewBox").style.display = "flex";
}

function closePreview() {
    document.getElementById("previewBox").style.display = "none";
}
</script>
</body>
</html>
